# Project name is pinned so the compose project / image / volume stay "rigger"
# even though the compose file now lives in src/ (the dir basename is "src").
name: rigger

services:

  # ── Rigger ──────────────────────────────────────────────────────────────────────
  rigger:
    # The published image (self-update Phase 1). `docker compose pull` fetches this
    # from GHCR; installs run the image without building. `image:` and `build:`
    # coexist intentionally: it's also the tag a local `--build` produces, so
    # contributors/dev still build from source with `docker compose up --build`.
    image: ghcr.io/mansoor/rigger:${RIGGER_IMAGE_TAG:-latest}
    build:
      # Build context is the repo root so the image can bake in templates/
      # (single-image distribution; toolkit logic lives in the Go binary).
      context: ..
      dockerfile: src/Dockerfile
      args:
        # Stamp the running version (self-update Phase 0). Defaults to "dev" for
        # a plain local build; CI/release passes the real tag + short SHA.
        RIGGER_VERSION: ${RIGGER_VERSION:-dev}
        RIGGER_COMMIT: ${RIGGER_COMMIT:-}
    container_name: rigger
    restart: unless-stopped
    ports:
      - "${RIGGER_PORT:-8080}:8080"
    volumes:
      # NOTE: toolkit logic lives in the Go binary (no scripts) — the old
      # `../:/toolkit:ro` code mount has been removed. Only rw DATA is mounted.
      # Workspaces (read-write): config.json, envs/, backups/ live here
      - ../workspaces:/toolkit/workspaces
      # Templates (read-write): allows saving new templates from the Tools page
      - ../templates:/toolkit/templates
      # Docker socket: needed for shell bridge to run docker commands
      - /var/run/docker.sock:/var/run/docker.sock
      # Host root (read-only): lets dashboard disk stats and the disk_above_pct
      # alert measure the REAL host filesystem instead of the container overlay.
      - /:/host:ro
      # Proxmox LXC note: a Docker container reads the kernel's /proc, so the
      # dashboard's Host memory + uptime reflect the PROXMOX HOST, not this LXC
      # (a nested container bypasses the LXC's lxcfs-virtualized /proc). If this
      # LXC runs lxcfs, UNCOMMENT the two lines below to make those stats reflect
      # the LXC. Leave commented on bare-metal/VM hosts (the paths won't exist).
      # Verify the path first: `ls /var/lib/lxcfs/proc/` inside the LXC.
      # - /var/lib/lxcfs/proc/meminfo:/proc/meminfo:ro
      # - /var/lib/lxcfs/proc/uptime:/proc/uptime:ro
      # Persistent data: SQLite DB
      - rigger-data:/data
      # Traefik's ACME cert store (read-only): lets the env card show the live
      # Let's Encrypt cert issuer + expiry for SSL envs (reads acme.json/acme-dns.json).
      - traefik-certs:/certs:ro
      # Out-of-band override certs + dynamic TLS config (rigger writes; Traefik file-provider reads).
      - rigger-dynamic:/dynamic
    environment:
      - LISTEN_ADDR=:8080
      - TOOLKIT_ROOT=/toolkit
      - WORKSPACES_DIR=/toolkit/workspaces
      - DATA_DIR=/data
      # Host filesystem mount point for disk metrics (see volumes: /:/host:ro)
      - HOST_FS_PATH=/host
      # Notifications use the in-process apprise-go library by default (no extra
      # container). To use the Apprise API sidecar instead, uncomment the
      # `apprise` service below and set APPRISE_URL to point at it:
      # - APPRISE_URL=http://apprise:8000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      # Host LAN/public address detected by the installer — seeded into the
      # `app_host` setting on first boot (used for local app links + magic-DNS
      # URLs). The containerized server can't detect the host IP itself. Empty ⇒
      # links fall back to the browser hostname; edit in Settings → General.
      - RIGGER_APP_HOST=${RIGGER_APP_HOST:-}
      # Cloudflare DNS-01 token — lets rigger issue per-env/per-workspace override
      # certs out-of-band via one-shot lego (DNS-01). Same token as Traefik's `dns`
      # resolver; from src/.env. Empty ⇒ per-email overrides can't be issued.
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
      # Self-update (Phase 3): host path to the Rigger install dir (the compose
      # project lives at $RIGGER_HOST_DIR/src). The in-app updater spawns a
      # detached helper that bind-mounts this to run `compose pull && up -d`.
      # Set by install.sh; empty ⇒ one-click apply is disabled (manual update only).
      - RIGGER_HOST_DIR=${RIGGER_HOST_DIR:-}
      # The image tag this instance runs — the updater's apply/rollback default.
      - RIGGER_IMAGE_TAG=${RIGGER_IMAGE_TAG:-latest}
      # Local timezone for server-rendered timestamps (e.g. pipeline alert times).
      # Default UTC; set e.g. America/Los_Angeles in .env. tzdata is in the image.
      - TZ=${TZ:-UTC}
    networks:
      - traefik_net
    # Optional: expose Rigger UI itself via Traefik + SSL at RIGGER_DOMAIN.
    # Uncomment labels block and set RIGGER_DOMAIN in .env to enable.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.rigger.rule=Host(`${RIGGER_DOMAIN}`)"
    #   - "traefik.http.routers.rigger.entrypoints=websecure"
    #   - "traefik.http.routers.rigger.tls=true"
    #   - "traefik.http.routers.rigger.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.rigger.loadbalancer.server.port=8080"

  # ── Apprise API sidecar (OPTIONAL) ────────────────────────────────────────────
  # Rigger delivers non-email notifications via the embedded apprise-go library by
  # default, so this container is NOT needed. Uncomment it (and set APPRISE_URL
  # on the rigger service above) only if you prefer the upstream Python Apprise
  # — e.g. for its broadest service coverage or to update notifications
  # independently of Rigger by bumping this image. Internal-only on traefik_net.
  # apprise:
  #   image: caronc/apprise:latest
  #   container_name: rigger-apprise
  #   restart: unless-stopped
  #   networks:
  #     - traefik_net

  # ── Traefik reverse proxy ─────────────────────────────────────────────────────
  # Routes HTTP/HTTPS traffic to workspace containers based on Docker labels.
  # Issues and renews Let's Encrypt certificates automatically.
  #
  # Requirements for SSL:
  #   • ACME_EMAIL must be set in .env
  #   • Port 80 must be publicly reachable for the HTTP-01 ACME challenge
  #   • Each workspace domain must resolve to this server in DNS
  #
  # If another proxy (Nginx, Cloudflare, HAProxy) sits in front, configure it
  # to forward ports 80 and 443 to this server. Set Cloudflare to "Full" SSL
  # mode if used, so the HTTP-01 challenge on port 80 can reach Traefik.
  traefik:
    image: traefik:v3.4
    container_name: rigger-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command:
      # ── Entrypoints ──
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # ── Docker provider ──
      # Watches all containers on traefik_net for label changes. Talks to Docker
      # through the socket-proxy over TCP (NOT the raw socket): Docker Desktop
      # proxies the mounted socket and its proxy breaks Traefik's direct API
      # calls; the socket-proxy re-exposes a clean, allowlisted API. Also more
      # secure (Traefik never touches the socket) and works on plain dockerd.
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.network=traefik_net
      - --providers.docker.exposedbydefault=false
      # ── Let's Encrypt ACME (HTTP-01 challenge) — per-host certs ──
      # Used for custom domains + base-domain envs when no DNS provider is set.
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # ── Let's Encrypt ACME (DNS-01 challenge) — WILDCARD certs ──
      # Lets Traefik issue *.{apps_base_domain} via the DNS provider's API (no
      # port-80 challenge), so every app under the base domain shares ONE cert.
      # Only used by routers composegen emits with certresolver=dns (when the
      # admin sets a DNS provider in Settings → General). Cloudflare reads the
      # token from CF_DNS_API_TOKEN (set in src/.env). Empty token ⇒ resolver
      # exists but is never exercised, so this is harmless when DNS-01 is unused.
      - --certificatesresolvers.dns.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.dns.acme.storage=/certs/acme-dns.json
      - --certificatesresolvers.dns.acme.dnschallenge=true
      - --certificatesresolvers.dns.acme.dnschallenge.provider=cloudflare
      # HTTP→HTTPS redirect is now per-router (emitted by composegen for SSL
      # envs only), so HTTP-only local envs (*.localhost) aren't forced onto a
      # cert-less HTTPS. Do NOT re-add a global web→websecure redirection here.
      # ── File provider (per-email override certs) ──
      # Rigger issues per-workspace/per-env Let's Encrypt certs OUT-OF-BAND (one-shot
      # lego, DNS-01) under their own ACME email, then drops the cert + a dynamic TLS
      # config into this watched dir — Traefik hot-reloads them with NO restart. An
      # empty/absent dir is a no-op, so this is harmless until an override is used.
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      # ── Logging ──
      - --log.level=INFO
      - --accesslog=false
      # ── Dashboard (disabled by default) ──
      # To enable: change to --api.dashboard=true and add labels to this service.
      - --api.dashboard=false
    environment:
      # Cloudflare DNS-01 API token for the wildcard cert (see the `dns` resolver
      # above). Set CF_DNS_API_TOKEN in src/.env; leave blank to disable DNS-01.
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    volumes:
      # Certificate storage — mount a named volume so certs survive restarts
      - traefik-certs:/certs
      # Out-of-band override certs + their dynamic TLS config (rigger writes; read-only here)
      - rigger-dynamic:/dynamic:ro
    networks:
      - traefik_net
    depends_on:
      - socket-proxy

  # ── Docker socket proxy (API-version rewriter) ──
  # Traefik hardcodes Docker API v1.24, but Docker 29+ daemons set
  # MinAPIVersion=1.40 and reject /v1.24/* with HTTP 400 — so Traefik's provider
  # can't read containers. This nginx rewrites the version prefix to a supported
  # one, then forwards to the read-only socket. Also keeps Traefik off the raw
  # socket (security).
  socket-proxy:
    image: nginx:1.27-alpine
    container_name: rigger-socket-proxy
    restart: unless-stopped
    volumes:
      - ./docker-proxy.nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik_net

  # ── Fallback "app starting / not reachable" page ──────────────────────────────
  # A catch-all router at the LOWEST Traefik priority. When the requested host has no
  # app router (the app is still starting, stopped, building, or the address is wrong),
  # Traefik would otherwise return a bare "404 page not found" — this serves a friendly,
  # auto-refreshing page instead. Real app routers carry a Host(...) rule, so their
  # priority is far higher and they ALWAYS win once the app is up; this only shows when
  # nothing else answers. HTTP (web) entrypoint only — HTTPS/base-domain envs still get
  # Traefik's default until a per-host cert/catch-all is added (future).
  fallback:
    image: nginx:1.27-alpine
    container_name: rigger-fallback
    restart: unless-stopped
    volumes:
      - ./fallback.default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fallback.html:/usr/share/nginx/html/index.html:ro
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rigger-fallback.rule=PathPrefix(`/`)"
      - "traefik.http.routers.rigger-fallback.entrypoints=web"
      - "traefik.http.routers.rigger-fallback.priority=1"
      - "traefik.http.routers.rigger-fallback.service=rigger-fallback"
      - "traefik.http.services.rigger-fallback.loadbalancer.server.port=80"
      # "rigger-loading" errors middleware — when an APP router's backend is down
      # (502/503/504 while it's still starting or crash-looping), serve this same
      # friendly page instead of a bare gateway error. App routers reference it as
      # rigger-loading@docker (see composegen). The catch-all router above only
      # handles the "no router at all" case; this covers "router exists, backend not
      # ready", which is what users hit during a slow first boot (e.g. SonarQube).
      - "traefik.http.middlewares.rigger-loading.errors.status=502-504"
      - "traefik.http.middlewares.rigger-loading.errors.service=rigger-fallback"
      - "traefik.http.middlewares.rigger-loading.errors.query=/"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  # Shared Docker network for Traefik routing.
  # Declared external so no single compose project owns it — both this file
  # and all workspace compose files attach to it without label conflicts.
  #
  # Create it once before first deploy:
  #   docker network create traefik_net
  traefik_net:
    external: true
    name: traefik_net

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  rigger-data:
  # Let's Encrypt certificate store — back this volume up regularly
  traefik-certs:
  # Out-of-band override certs + their dynamic TLS config (rigger ⇄ Traefik file provider)
  rigger-dynamic:
