# Tiny Docker API proxy for Traefik. Traefik hardcodes API version v1.24, but
# Docker 29+ daemons set MinAPIVersion=1.40 and reject /v1.24/* with HTTP 400.
# This rewrites any /v1.NN/ prefix up to a supported version, then forwards to
# the (read-only) Docker socket. Traefik only ever issues read calls.
# Workers run as root so they can read the root-owned Docker socket.
user root;
events {}
http {
  upstream docker_sock { server unix:/var/run/docker.sock; }
  server {
    listen 2375;
    location / {
      rewrite ^/v[0-9]+\.[0-9]+/(.*)$ /v1.47/$1 break;
      proxy_pass http://docker_sock;
      proxy_http_version 1.1;
      proxy_set_header Host localhost;
      proxy_set_header Connection "";
      proxy_buffering off;        # Docker /events is a long-lived stream
      proxy_read_timeout 1h;
    }
  }
}
