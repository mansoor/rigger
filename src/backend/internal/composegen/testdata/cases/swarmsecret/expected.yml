# ============================================================
# docker-compose.yml — prod environment
# Project : myapp  (type: custom)
# Version : 1.0.0-build.1
# Generated: 2026-01-01 00:00:00 UTC
# Regenerate: ./run.sh refresh prod
# ============================================================

networks:
  myapp_prod_net:
    driver: overlay

secrets:
  myapp_prod_POSTGRES_PASSWORD_v2:
    external: true

volumes:
  myapp_prod_pg_data:
  myapp_prod_uploads:

services:

  # ── Backend (nodejs) ──────────────────────────────────────────────────────
  myapp_prod_backend:
    image: ${BACKEND_IMAGE:-reg.example.com/myapp-backend:1.0.0-build.1-prod}
    container_name: myapp_prod_backend
    env_file: .env
    volumes:
      - myapp_prod_uploads:/app/storage/uploads
    networks:
      - myapp_prod_net
    depends_on:
      - myapp_prod_postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || curl -sf http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    secrets:
      - source: myapp_prod_POSTGRES_PASSWORD_v2
        target: POSTGRES_PASSWORD

  # ── Nginx ──────────────────────────────────────────────────────────────────
  myapp_prod_nginx:
    image: nginx:1.27-alpine
    container_name: myapp_prod_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - myapp_prod_uploads:/var/www/uploads:ro
    depends_on:
      - myapp_prod_backend
    networks:
      - myapp_prod_net
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    secrets:
      - source: myapp_prod_POSTGRES_PASSWORD_v2
        target: POSTGRES_PASSWORD

  # ── PostgreSQL 16-alpine ────────────────────────────────────────────────
  myapp_prod_postgres:
    image: postgres:16-alpine
    container_name: myapp_prod_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    volumes:
      - myapp_prod_pg_data:/var/lib/postgresql/data
    networks:
      - myapp_prod_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    secrets:
      - source: myapp_prod_POSTGRES_PASSWORD_v2
        target: POSTGRES_PASSWORD

