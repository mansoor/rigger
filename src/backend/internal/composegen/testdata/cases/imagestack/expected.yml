# ============================================================
# docker-compose.yml — prod environment
# Project : obs  (type: image)
# Version : 1.0.0-build.0
# Generated: 2026-06-04 08:24:33 UTC
# Regenerate: ./run.sh refresh prod
# ============================================================

networks:
  obs_prod_net:
    driver: bridge
  traefik_net:
    external: true

volumes:
  obs_prod_pgdata:
  obs_prod_extra:

services:

  # ── db (postgres:16) ─────────────────────────────────────────
  obs_prod_db:
    image: postgres:16
    container_name: obs_prod_db
    env_file: .env
    networks:
      obs_prod_net:
        aliases:
          - db
    volumes:
      - obs_prod_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB=obs
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=obs
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $obs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ── app (grafana/grafana:latest) ─────────────────────────────────────────
  obs_prod_app:
    image: grafana/grafana:latest
    container_name: obs_prod_app
    env_file: .env
    command: './run.sh --verbose'
    networks:
      obs_prod_net:
        aliases:
          - app
      traefik_net: {}
    depends_on:
      obs_prod_db:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
      - "9090:9090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.obs_prod_app.rule=Host(`obs.example.com`)"
      - "traefik.http.routers.obs_prod_app.entrypoints=web"
      - "traefik.http.services.obs_prod_app.loadbalancer.server.port=3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

