# Rigger Traefik fallback page (served by the rigger-fallback nginx).
# Every request returns 503 Service Unavailable with the friendly "app starting / not
# reachable" page body, plus Retry-After so clients/monitors know to retry. This is only
# ever hit via Traefik's lowest-priority catch-all router (no app router matched the host).
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    error_page 503 /index.html;

    location / {
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
        return 503;
    }

    # Only reachable via the internal error_page redirect above, not directly.
    location = /index.html {
        internal;
    }
}
