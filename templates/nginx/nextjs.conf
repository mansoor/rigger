# =============================================================================
# Nginx config — Next.js frontend upstream proxy
# Variables substituted by bootstrap.sh:
#   {{DOMAIN}}   → e.g. dev.myapp.com
#   {{PREFIX}}   → e.g. myapp_dev
# =============================================================================

upstream {{PREFIX}}_nextjs {
    server {{PREFIX}}_frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name {{DOMAIN}};

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/{{PREFIX}}_access.log;
    error_log  /var/log/nginx/{{PREFIX}}_error.log warn;

    # Next.js static files (long-cache)
    location /_next/static/ {
        proxy_pass http://{{PREFIX}}_nextjs;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js HMR websocket (dev only — harmless in prod)
    location /_next/webpack-hmr {
        proxy_pass http://{{PREFIX}}_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Everything else to Next.js
    location / {
        proxy_pass http://{{PREFIX}}_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location ~ /\. { deny all; }

    client_max_body_size 32M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
