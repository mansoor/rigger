# =============================================================================
# Nginx config — React (Vite) SPA static file server
# Used when the backend nginx also serves the React SPA from a shared proxy,
# or as a standalone server block for a dedicated frontend container.
# Variables substituted by bootstrap.sh:
#   {{DOMAIN}}   → e.g. dev.myapp.com
#   {{PREFIX}}   → e.g. myapp_dev
# =============================================================================

server {
    listen 80;
    server_name {{DOMAIN}};
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/{{PREFIX}}_access.log;
    error_log  /var/log/nginx/{{PREFIX}}_error.log warn;

    # Vite build assets — immutable cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Health check
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location ~ /\. { deny all; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
