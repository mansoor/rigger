# =============================================================================
# Nginx config — Node.js backend (upstream reverse proxy)
# Variables substituted by bootstrap.sh:
#   {{DOMAIN}}   → e.g. dev.myapp.com
#   {{PREFIX}}   → e.g. myapp_dev
# =============================================================================

upstream {{PREFIX}}_node {
    server {{PREFIX}}_backend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name {{DOMAIN}};

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/{{PREFIX}}_access.log;
    error_log  /var/log/nginx/{{PREFIX}}_error.log warn;

    # Uploads served directly
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # WebSocket upgrade support
    location /ws {
        proxy_pass http://{{PREFIX}}_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # API + everything else
    location / {
        proxy_pass http://{{PREFIX}}_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health check
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }

    client_max_body_size 64M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
