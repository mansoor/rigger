# SPA server: serve static assets, fall back to index.html for client-side routes.
# Referenced by templates/dockerfiles/react/Dockerfile (COPY docker/nginx-spa.conf …).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed build assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else → index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
