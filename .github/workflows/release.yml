name: release

# Build + publish the Rigger image to GHCR on a semver tag (self-update Phase 1),
# AND create a GitHub Release for the tag so the in-app updater can detect it.
# Tag a release with `git tag v1.2.3 && git push origin v1.2.3` → this publishes
#   ghcr.io/mansoor/rigger:1.2.3  and  ghcr.io/mansoor/rigger:latest
# and a GitHub Release v1.2.3 (Admin → Updates reads /releases/latest, NOT tags —
# a pushed tag alone is invisible to the updater).
# The version is stamped into the binary via the RIGGER_VERSION/RIGGER_COMMIT
# build args (see src/Dockerfile + internal/buildinfo).
#
# NOTE: the GHCR package must be made PUBLIC once (Packages → rigger → settings)
# so installs can pull it without credentials.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release (the in-app updater reads /releases/latest)
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mansoor/rigger
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Build context is the repo root (the image bakes in templates/).
          context: .
          file: src/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RIGGER_VERSION=${{ github.ref_name }}
            RIGGER_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publish a GitHub Release for the tag so the in-app updater (which reads the
      # GitHub Releases API) can see the new version + show its changelog. A pushed
      # tag alone is NOT a Release. Notes are auto-generated from commits/PRs.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
